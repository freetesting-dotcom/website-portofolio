<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Bertambah Usia, Sayang 🌸</title>
    
    <!-- Library Animasi GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <!-- Link ke file CSS -->
    <link rel="stylesheet" href="./cause.css">
</head>
<body>
    <!-- Elemen custom-cursor sudah dihapus dari sini -->

    <div class="container">
        <h1>Happy Birthday Auliaa 💖</h1>
        
        <!-- Tempat kartu-kartu alasan akan dimunculkan oleh JavaScript -->
        <div id="reasons-container"></div>
        
        <button class="shuffle-button">Buka Kejutannya 💕</button>
        <div class="reason-counter"></div>

        <div class="ending-section">
            <div class="teddy-hug">
                <!-- Pastikan style untuk gambar ini sudah proporsional -->
                <img src="./d1.jpg" alt="Teddy Hug" style="max-width: 100%; border-radius: 15px;">
            </div>
            <div class="ending-text">Kamu Selalu Jadi Alasan Senyumku. ❤️</div>
        </div>
    </div>

    <!-- Link ke file JavaScript -->
    <script src="cause.js"></script>
</body>
</html>
